name: Build ARM64 ISO (Noble)

# 用 GitHub 原生 ARM64 runner 构建 rescuezilla 的 noble-arm64 ISO。
# 对公开仓库免费且不限次数。原生 arm64,无需 binfmt/qemu 交叉模拟。
#
# 关键修改:跳过 partclone-latest 编译(在 runner 上用 checkinstall 编译 partclone
# 反复出问题),改用 chroot 里 apt 预装的 partclone(clonezilla 依赖它,版本 0.3.37)。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支/tag'
        required: true
        default: 'initial-arm64-noble-iso-build'

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: 检出代码(含子模块与 LFS)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: 显示架构确认
        run: |
          echo "架构: $(uname -m)"
          echo "发行版: $(lsb_release -cs)"

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install --yes \
            build-essential dpkg-dev \
            make rsync sudo debootstrap squashfs-tools xorriso \
            git git-lfs gettext \
            dosfstools mtools checkinstall cmake time \
            shim-signed \
            devscripts debhelper ccache \
            libtool-bin gawk pkg-config comerr-dev docbook-xsl e2fslibs-dev fuse3 \
            libaal-dev libblkid-dev libbsd-dev libext2fs-dev libncurses5-dev \
            libncursesw5-dev libreadline-dev libreadline8 \
            libreiser4-dev libtinfo-dev libxslt1.1 nilfs-tools ntfs-3g ntfs-3g-dev \
            quilt sgml-base uuid-dev vmfs-tools xfslibs-dev xfsprogs xml-core \
            xsltproc libssl-dev libxxhash-dev \
            grub-efi-arm64 grub-efi-arm64-bin \
            python3-gi libgtk-3-dev python3-whichcraft python3-babel \
            curl bash-completion

      - name: Git safe directory
        run: git config --global --add safe.directory '*'

      - name: 补丁 Makefile:从 noble-arm64 去掉 partclone-latest 依赖
        run: |
          # noble-arm64 原依赖: deb partclone-latest partclone-nbd $(buildscripts)
          # 改为:        deb partclone-nbd $(buildscripts)
          # 原因:partclone-latest 用 checkinstall 在宿主机编译 partclone 0.3.40,
          #   在 GitHub runner 上反复失败(bash-completion 目录缺失等)。
          #   chroot 里 clonezilla 已经依赖 partclone(apt 装 0.3.37),
          #   不需要宿主机编译的 deb。
          python3 -c "
          with open('Makefile') as f: c = f.read()
          old = 'noble-arm64: deb partclone-latest partclone-nbd \$(buildscripts)'
          new = 'noble-arm64: deb partclone-nbd \$(buildscripts)'
          if old in c:
              c = c.replace(old, new)
              with open('Makefile','w') as f: f.write(c)
              print('Makefile 已补丁: noble-arm64 不再依赖 partclone-latest')
          else:
              print('警告: 未找到目标行,可能 Makefile 结构已变化')
              # 尝试另一种匹配(可能有不同的空格)
              import re
              c2 = re.sub(
                  r'(noble-arm64:\s+deb\s+)partclone-latest(\s+)',
                  r'\1\2',
                  c
              )
              if c2 != c:
                  with open('Makefile','w') as f: f.write(c2)
                  print('Makefile 已补丁(正则): noble-arm64 不再依赖 partclone-latest')
              else:
                  print('错误: 无法补丁 Makefile')
          "

      - name: 补丁 chroot-steps-part-2.sh:跳过 partclone #367 hack
        run: |
          # chroot-steps-part-2.sh 有一段 #367 hack:
          #   先备份仓库版 partclone.xfs,装完编译版 deb 后覆盖回去。
          # 不编译 partclone deb 后,这段 cp/mv 会失败(找不到文件)。
          # 用条件判断包裹它们:只有文件存在时才执行。
          python3 -c "
          with open('src/scripts/chroot-steps-part-2.sh') as f: c = f.read()
          # 把 partclone.xfs 的 cp 备份改成条件执行
          c = c.replace(
              'cp -r /usr/sbin/partclone.xfs /',
              'if [ -f /usr/sbin/partclone.xfs ]; then cp -r /usr/sbin/partclone.xfs /; fi'
          )
          c = c.replace(
              'mv /partclone.xfs /usr/sbin/',
              'if [ -f /partclone.xfs ]; then mv /partclone.xfs /usr/sbin/; fi'
          )
          with open('src/scripts/chroot-steps-part-2.sh','w') as f: f.write(c)
          print('chroot-steps-part-2.sh 已补丁: partclone #367 hack 改为条件执行')
          "

      - name: 磁盘空间检查(构建前)
        run: df -h /

      - name: 构建 DEB 包 + partclone-nbd + ARM64 Noble ISO
        run: sudo make noble-arm64
        continue-on-error: true

      - name: 查看构建产物
        run: |
          echo "=== build/ 目录 ==="
          ls -lh build/ 2>/dev/null || echo "build/ 不存在"
          echo "=== 查找 ISO ==="
          find build/ -name '*.iso' -print -exec ls -lh {} \; 2>/dev/null || true
          echo "=== 磁盘空间(构建后) ==="
          df -h /

      - name: 即使构建失败也上传所有产物
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rescuezilla-arm64-build-output
          path: |
            build/*.iso
            build/**/*.iso
            build/**/rescuezilla*.*
          if-no-files-found: warn
          retention-days: 30

      - name: 上传构建日志(如果脚本有输出)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-make-output-log
          path: |
            build/*.log
          if-no-files-found: warn
          retention-days: 7
